name: CI Flutter

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  testes:
    name: Testes (flutter test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Flutter 3.38.10
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Rodar testes
        run: flutter test
